# Builds the extension zip and attaches it to a GitHub Release.
# Disabled by default: runs only when triggered by hand AND the repository
# variable RELEASE_ENABLED is set to "true" (Settings → Secrets and variables → Actions → Variables).
name: Release

on:
  workflow_dispatch:
  # Uncomment to release automatically when a version tag is pushed:
  # push:
  #   tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version dist/manifest.json)
          tag="v${version}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "${tag}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest version ${version}"
            exit 1
          fi
          mv lt-checker.zip "lt-checker-${version}.zip"
          gh release create "${tag}" "lt-checker-${version}.zip" \
            --title "LT Checker ${version}" --generate-notes --target "${GITHUB_SHA}"
