# Access is granted with a valid client certificate OR a valid bearer token.
# The token lives in a separate file so it never ends up in this config:
#   /etc/nginx/secrets/lt-token.map  ->  "Bearer <token>" 1;
map $http_authorization $lt_token_ok {
    default 0;
    include /etc/nginx/secrets/lt-token.map;
}

map "$ssl_client_verify|$lt_token_ok" $lt_allowed {
    default     0;
    "~^SUCCESS\|" 1;
    "~\|1$"       1;
}

server {
    listen [::]:443 ssl;
    listen 443 ssl;

    server_name lt.example.info;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Client certificate is requested but no longer mandatory; checked below.
    ssl_client_certificate /etc/nginx/certs/client-ca.pem;
    ssl_verify_client optional;
    ssl_verify_depth 1;

    location / {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Length' 0;
            return 204;
        }

        if ($lt_allowed = 0) {
            return 401;
        }

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

        # Don't forward the token to LanguageTool.
        proxy_set_header Authorization "";

        proxy_pass http://languagetool:8010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
